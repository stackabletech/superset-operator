---
apiVersion: v2
name: superset-operator
version: "0.0.0-dev"
appVersion: "0.0.0-dev"
description: "Kubernetes operator for Apache Superset. Deploy and run Superset with the Stackable Data Platform (SDP)."
home: https://github.com/stackabletech/superset-operator
# One known use of this is the Artifact Hub (AH) listing which shows the logo.
# AH downloads the logo and re-hosts it.
# We opted to not use the project logos (e.g. the Apache Spark logo) here due to trademark concerns.
icon: https://raw.githubusercontent.com/stackabletech/superset-operator/main/.readme/static/borrowed/Icon_Stackable.svg
sources:
  - https://github.com/stackabletech/superset-operator
keywords: ["apache-superset", "superset", "business-intelligence", "dashboards", "kubernetes", "operator"]
# Artifact Hub drops any maintainer entry that has no email.
maintainers:
  - name: Stackable GmbH
    email: info@stackable.tech
    url: https://www.stackable.tech
# Consumed by Artifact Hub, see https://artifacthub.io/docs/topics/annotations/helm/
annotations:
  # The chart package ships no LICENSE file, so Artifact Hub cannot detect this itself.
  artifacthub.io/license: OSL-3.0
  # Artifact Hub currently infers this from "operator" in the chart name but I don't want to rely on the heuristics.
  artifacthub.io/operator: "true"
  # Unset means Artifact Hub predicts a category from the keywords, which it gets wrong a lot for our stuff
  artifacthub.io/category: skip-prediction
  artifacthub.io/alternativeName: superset
  # A link named "support" is rendered highlighted by Artifact Hub. Keep it lowercase.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.stackable.tech/home/stable/superset/
    - name: Stackable Hub
      url: https://hub.stackable.tech/components/superset
    - name: support
      url: https://github.com/stackabletech/superset-operator/issues
    - name: Operator image on quay.io
      url: https://quay.io/repository/stackable/sdp/superset-operator
  artifacthub.io/crds: |-
    - kind: SupersetCluster
      version: v1alpha1
      name: supersetclusters.superset.stackable.tech
      displayName: SupersetCluster
      description: A Superset cluster stacklet. This resource is managed by the Stackable operator for Apache Superset.
    - kind: DruidConnection
      version: v1alpha1
      name: druidconnections.superset.stackable.tech
      displayName: DruidConnection
      description: The DruidConnection resource can be used to automatically deploy a Druid datasource in Superset.
