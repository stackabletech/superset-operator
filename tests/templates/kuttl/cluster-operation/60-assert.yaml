---
# The recreated StatefulSet must bring the cluster back to ready, and the recreated
# objects must carry an owner reference back to the SupersetCluster so that garbage
# collection still works for them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
timeout: 600
commands:
  - script: kubectl -n $NAMESPACE wait --for=condition=available supersetclusters.superset.stackable.tech/superset --timeout 601s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: superset-node-default
  ownerReferences:
    - apiVersion: superset.stackable.tech/v1alpha1
      controller: true
      kind: SupersetCluster
      name: superset
status:
  readyReplicas: 2
  replicas: 2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superset-serviceaccount
  ownerReferences:
    - apiVersion: superset.stackable.tech/v1alpha1
      controller: true
      kind: SupersetCluster
      name: superset
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: superset-rolebinding
  ownerReferences:
    - apiVersion: superset.stackable.tech/v1alpha1
      controller: true
      kind: SupersetCluster
      name: superset
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: superset-node
  ownerReferences:
    - apiVersion: superset.stackable.tech/v1alpha1
      controller: true
      kind: SupersetCluster
      name: superset
---
apiVersion: listeners.stackable.tech/v1alpha1
kind: Listener
metadata:
  name: superset-node
  ownerReferences:
    - apiVersion: superset.stackable.tech/v1alpha1
      controller: true
      kind: SupersetCluster
      name: superset
---
apiVersion: v1
kind: Service
metadata:
  name: superset-node-default-headless
  ownerReferences:
    - apiVersion: superset.stackable.tech/v1alpha1
      controller: true
      kind: SupersetCluster
      name: superset
---
apiVersion: v1
kind: Service
metadata:
  name: superset-node-default-metrics
  ownerReferences:
    - apiVersion: superset.stackable.tech/v1alpha1
      controller: true
      kind: SupersetCluster
      name: superset
